name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Package Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Validate Gradle Wrapper Files
        run: |
          echo "Checking essential Gradle Wrapper files..."
          test -f gradlew || (echo "ERROR: 'gradlew' script is missing from repository root." && exit 1)
          test -f gradle/wrapper/gradle-wrapper.jar || (echo "ERROR: 'gradle/wrapper/gradle-wrapper.jar' is missing." && exit 1)
          test -f gradle/wrapper/gradle-wrapper.properties || (echo "ERROR: 'gradle/wrapper/gradle-wrapper.properties' is missing." && exit 1)
          chmod +x ./gradlew
          echo "Gradle wrapper files verified and execution permission granted."

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK Generation
        id: verify-apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            FILE_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
            echo "SUCCESS: APK file verified at $APK_PATH"
            echo "APK Size: $FILE_SIZE bytes"
            sha256sum "$APK_PATH"
          else
            echo "ERROR: Expected APK not found at $APK_PATH"
            echo "Listing build output directory contents:"
            ls -la app/build/outputs/apk/debug/ || echo "Directory does not exist"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: life-tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
